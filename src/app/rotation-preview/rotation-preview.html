@if (showPreview()) {
  <div
    class="rotation-preview"
    [id]="'rotation-preview-' + index"
    >
    @for (row of getDisplayRows(); track trackByRowIndex($index, row)) {
      <div class="rotation-preview-row">
        @for (item of row; track trackByDisplaySelection($index, item)) {
          @if (item.selection.SelectedAbility) {
            <span class="row-spacer">{{ item.selection.Separator }}</span>
            <span
              class="ability-image-container"
              [class.active-step]="hasAnyTrackedSlot() && item.stepIndex === activeStepIndex"
              [class.completed-step]="hasAnyTrackedSlot() && activeStepIndex > 0 && item.stepIndex >= 0 && item.stepIndex < activeStepIndex"
              >
              <img
                class="ability-image"
                [src]="item.selection.SelectedAbility.Src"
                [alt]="item.selection.SelectedAbility.Title"
                [title]="item.selection.SelectedAbility.Emoji"
                loading="lazy"
                (error)="onImageError($event, item.selection.SelectedAbility)"
                (load)="onImageLoad($event, item.selection.SelectedAbility)"
                />
              @if (item.selection.Notes) {
                <p class="ability-note">
                  {{ item.selection.Notes }}
                </p>
              }
            </span>
          }
        }
      </div>
    }
  </div>
}
